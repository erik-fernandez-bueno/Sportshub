<aside>
  <div class="registeraside">
    <img class="registerasideimg" src="/assets/Register.png" alt="">
  </div>
</aside>
<section class="registersection">
  <h1 id="registerh1section"> Crea el teu compte </h1>
  <form class="registerformsection">
    <input class="registerformsectioninput" type="text" id="fornom" name="nom" value="" placeholder="Nom"> <br>
    <input class="registerformsectioninput" type="text" id="forcognom" name="cognom" value="" placeholder="Cognom"> <br>
    <input class="registerformsectioninput" type="password" id="forpass" name="password" value="" placeholder="Contrasenya"> <br>
    <input class="registerformsectioninput" type="text" id="foradreça" name="adreça" value="" placeholder="Adreça"> <br>
    <input class="registerformsectioninput" type="text" id="fortelefon" name="telefon" value="" placeholder="Telèfon"> <br>
    <button class="registerformsectionbutton" type="submit"> CONTINUAR </button>
    <p class="registerformsectiontext">Ja tens un compte? <a [routerLink]="['/login']" class="linktext">Iniciar Sessió</a></p>
  </form>
</section>
