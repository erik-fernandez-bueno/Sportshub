<aside id="precioproducto" *ngIf="product">

  <img [src]="product.image" [alt]="product.name">

  <div class="contenido-derecha">

    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>

    <!-- TALLAS -->
    <div class="opciones" *ngIf="product.size?.length > 0">

      <!-- debug -->

      <ng-container *ngFor="let s of product.size; let i = index">
        <input
          type="radio"
          name="seleccion"
          [id]="'op' + i"
          [value]="s"
          [(ngModel)]="selectedSize"
        >
        <label class="opcion-label" [for]="'op' + i">
          {{ s }}
        </label>
      </ng-container>

    </div>

    <h2>{{ product.price }} €</h2>

    <button (click)="addToCart()" [disabled]="product.size?.length > 0 && !selectedSize">
      Afegir a la cistella
    </button>

    <p>Talla seleccionada: {{ selectedSize }}</p>

  </div>

</aside>
