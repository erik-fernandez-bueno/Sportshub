<aside>
  <div class="registeraside">
    <img class="registerasideimg" src="assets/login.png" alt="">
  </div>
</aside>
<section class="registersection">
  <h1 id="registerh1section"> Inici de sessió </h1>
  <form class="registerformsection">
    <input [(ngModel)]="dadesLogin.nom" class="registerformsectioninput" type="text" id="fornom" name="nom" value="" placeholder="Nom"> <br>
    <input [(ngModel)]="dadesLogin.password" class="registerformsectioninput" type="password" id="forpass" name="password" value="" placeholder="Contrasenya"> <br>
    <button (click)="iniciarSessio()" class="registerformsectionbutton" type="submit"> CONTINUAR </button> <br>
    <p class="registerformsectiontext">No tens un compte? <a [routerLink]="['/register']" class="linktext" >Crear</a></p>
    <p *ngIf="mensaje" [style.color]="mensaje.includes('correcte') ? 'green' : 'red'">
      {{ mensaje }}
    </p>
  </form>
</section>
