<div class="catalogo-header">
  <h1 id="cat">Catàleg unisex</h1>

  <select [(ngModel)]="categoriaSeleccionada" (change)="filtrarProductos()">
    <option value="todas">Todas</option>
    <option *ngFor="let categoria of categorias" [value]="categoria">
      {{ categoria }}
    </option>
  </select>
</div>

<div *ngIf="productosFiltrados.length > 0; else noProductos" class="catalogo">
  <div
    *ngFor="let producto of productosFiltrados"
    [routerLink]="['/producto', producto.id_productes]"
    class="catalogob"
  >
    <img
      [src]="producto.image"
      width="300"
      height="300"
      class="card-img-top"
      [alt]="producto.name"
    >
    <div class="card-body">
      <h5>{{ producto.name }}</h5>
      <p>{{ producto.description }}</p>
      <p class="precio">Precio: {{ producto.price }} €</p>
    </div>
  </div>
</div>

<ng-template #noProductos>
  <div class="no-productos">
    <img src="assets/source.gif" alt="No hay productos" class="no-productos-img">
    <p>No hay productos disponibles.</p>
  </div>
</ng-template>
