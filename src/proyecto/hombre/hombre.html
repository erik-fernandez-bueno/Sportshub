<h1 id="cat">Catàleg home</h1>
<select [(ngModel)]="selectedCategory">
  <option value="todas">pantalon</option>
  <option value="hombre">vehiculo</option>
  <option value="mujer">Mujer</option>
</select>
<div *ngFor="let product of filteredProducts" class="catalogob" [routerLink]="['/producto', product.id]">
  <img [src]="product.image" class="card-img-top" alt="...">
  <div class="card-body">
    <h5>{{ product.name }}</h5>
    <p class="card-text">{{ product.description }}</p>
  </div>
</div>
